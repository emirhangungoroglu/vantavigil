<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | SECURE DEPLOYMENT</title>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-green: #00ff41;
            --cyber-purple: #bc00ff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0; background: #020202; color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            perspective: 2000px;
        }

        /* Arka Plan Hareketli Grid */
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
                        repeating-linear-gradient(0deg, transparent 0, transparent 49px, rgba(0, 210, 255, 0.05) 50px),
                        repeating-linear-gradient(90deg, transparent 0, transparent 49px, rgba(0, 210, 255, 0.05) 50px);
            z-index: -1; transform: rotateX(20deg);
        }

        .container { display: flex; gap: 40px; }

        /* PAKET ANA YAPI */
        .pack {
            width: 260px; height: 400px;
            position: relative; cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.4s ease;
        }

        .pack:hover { transform: translateY(-15px) rotateY(10deg); }

        /* KART (İÇERİK) */
        .card {
            position: absolute; inset: 5px;
            background: linear-gradient(135deg, #111, #000);
            border: 1px solid var(--neon-blue);
            border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1; overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
        }

        /* YIRTILACAK KATMAN (FOIL) */
        .foil {
            position: absolute; inset: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #444 50%, #1a1a1a 100%);
            z-index: 10; border-radius: 10px;
            border: 2px solid #333;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }

        .foil::after {
            content: "VANTAVIGIL"; letter-spacing: 5px; color: #666; font-size: 14px;
        }

        /* YIRTILMA EFEKTİ (SOL PARÇA) */
        .tear-left {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: inherit; z-index: 11;
            clip-path: polygon(0 0, 100% 0, 0 100%); /* İlk aşama */
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* YIRTILMA EFEKTİ (SAĞ PARÇA) */
        .tear-right {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: inherit; z-index: 11;
            clip-path: polygon(100% 0, 100% 100%, 0 100%);
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* AKTİF YIRTILMA ANİMASYONU */
        .pack.opened .tear-left {
            transform: translateX(-150%) rotate(-45deg);
        }

        .pack.opened .tear-right {
            transform: translateX(150%) rotate(45deg);
        }

        .pack.opened .card {
            animation: cardGlow 2s infinite alternate;
        }

        @keyframes cardGlow {
            from { box-shadow: 0 0 20px var(--neon-blue); }
            to { box-shadow: 0 0 50px var(--neon-green); border-color: var(--neon-green); }
        }

        /* GÖRSEL ÖĞELER */
        .card-image {
            width: 80%; height: 50%;
            background: #080808; border-radius: 5px;
            margin-bottom: 20px; position: relative;
            overflow: hidden; border: 1px solid #222;
        }

        /* Encoder İkonu (placeholder) */
        .bolt { font-size: 50px; color: var(--neon-green); filter: drop-shadow(0 0 10px var(--neon-green)); }

        .title { font-weight: bold; font-size: 1.2rem; letter-spacing: 2px; }
        .status { font-size: 10px; color: var(--neon-blue); margin-top: 5px; }

        /* Kilitli Panel Modu */
        .locked .card { border-color: #333; filter: grayscale(1); }
        .locked-text { color: #444; font-size: 12px; margin-top: 10px; }

    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="container">
        
        <div class="pack" id="encoder-pack" onclick="openModule(this, '/vantavigil/encoder')">
            <div class="card">
                <div class="card-image" id="img-encoder">
                    <div style="display:flex; height:100%; align-items:center; justify-content:center;">
                        <span class="bolt">⚡</span>
                    </div>
                </div>
                <div class="title">ENCODER</div>
                <div class="status">DECRYPTION_READY</div>
            </div>
            <div class="foil tear-left"></div>
            <div class="foil tear-right"></div>
        </div>

        <div class="pack locked">
            <div class="card">
                <div class="card-image"></div>
                <div class="title">ROOT_SCAN</div>
                <div class="locked-text">ENCRYPTED_DATA</div>
            </div>
            <div class="foil"></div>
        </div>

        <div class="pack locked">
            <div class="card">
                <div class="card-image"></div>
                <div class="title">THREAT_MAP</div>
                <div class="locked-text">ENCRYPTED_DATA</div>
            </div>
            <div class="foil"></div>
        </div>

    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Gerçekçi Yırtılma Sesi (White Noise + Crackle)
        function playRipSound() {
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 800;
            
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        function openModule(element, url) {
            if (element.classList.contains('opened') || element.classList.contains('locked')) return;

            playRipSound();
            element.classList.add('opened');

            // Görsel bir patlama efekti (opsiyonel sarsıntı)
            element.style.animation = "shake 0.5s";

            setTimeout(() => {
                // Encoder sayfasına yönlendirme
                window.location.href = url;
            }, 2500); 
        }
    </script>

    <style>
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            50% { transform: translate(-1px, 2px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-0deg); }
        }
    </style>
</body>
</html>
