<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | DATA_PACK_DECRYPTOR</title>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-green: #00ff41;
            --bg-dark: #050505;
            --pack-gold: linear-gradient(135deg, #1a1a1a 0%, #333 50%, #1a1a1a 100%);
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Arka Plan Grid */
        body::after {
            content: "";
            position: absolute;
            width: 200%; height: 200%;
            background-image: linear-gradient(#0a0a0a 1px, transparent 1px), linear-gradient(90deg, #0a0a0a 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            transform: rotateX(60deg);
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid { from { transform: rotateX(60deg) translateY(0); } to { transform: rotateX(60deg) translateY(50px); } }

        /* PAKET (PACK) TASARIMI */
        .pack-container {
            width: 260px;
            height: 380px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            z-index: 100;
        }

        .pack-container:hover {
            transform: scale(1.05) rotateY(10deg);
        }

        .pack-visual {
            width: 100%;
            height: 100%;
            background: var(--pack-gold);
            border: 2px solid #444;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* Paket Üstündeki Parlama Efekti */
        .pack-visual::before {
            content: "";
            position: absolute;
            top: -150%; left: -150%;
            width: 300%; height: 300%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 4s infinite;
        }

        @keyframes shine { 0% { left: -150%; } 100% { left: 150%; } }

        .v-logo-central {
            font-size: 80px;
            font-weight: 900;
            color: var(--neon-blue);
            text-shadow: 0 0 20px var(--neon-blue);
            margin-bottom: 10px;
        }

        .pack-label {
            letter-spacing: 5px;
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }

        /* SARSILMA VE PATLAMA EFEKTLERİ */
        .shake { animation: shakeAnim 0.1s infinite; }
        @keyframes shakeAnim {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, -2px) rotate(-1deg); }
            100% { transform: translate(1px, 2px) rotate(1deg); }
        }

        .burst {
            position: absolute;
            width: 10px; height: 10px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 100px 50px white;
            opacity: 0;
            z-index: 200;
            pointer-events: none;
        }

        /* REVEAL (AÇILAN KART) */
        #access-card {
            position: absolute;
            width: 240px;
            height: 360px;
            background: #111;
            border: 2px solid var(--neon-green);
            border-radius: 15px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 150;
            box-shadow: 0 0 50px var(--neon-green);
        }

        /* ALT BİLGİ */
        .instruction {
            position: absolute;
            bottom: 50px;
            color: var(--neon-blue);
            letter-spacing: 2px;
            font-size: 14px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    </style>
</head>
<body>

    <div class="instruction" id="hint">CLICK TO DECRYPT DATA PACK</div>

    <div class="pack-container" id="mainPack" onclick="openPack()">
        <div class="pack-visual">
            <div class="v-logo-central">V</div>
            <div class="pack-label">VANTAVIGIL</div>
            <div style="font-size: 10px; margin-top: 20px; color: #555;">[SECURE_INTEL_PACKAGE]</div>
        </div>
    </div>

    <div id="access-card">
        <h2 style="color: var(--neon-green);">ACCESS GRANTED</h2>
        <div style="width: 80px; height: 2px; background: var(--neon-green); margin: 10px 0;"></div>
        <p style="font-size: 12px; color: #aaa;">IDENTITY: EMIRHAN_GUNGOROGLU</p>
        <p style="font-size: 10px; color: #555;">REDIRECTING TO MODULES...</p>
    </div>

    <div class="burst" id="burstEffect"></div>

    <script>
        const pack = document.getElementById('mainPack');
        const card = document.getElementById('access-card');
        const burst = document.getElementById('burstEffect');
        const hint = document.getElementById('hint');

        // Ses Motoru
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(freq, type, dur, vol) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        function openPack() {
            hint.style.display = 'none';
            // 1. Aşama: Sarsılma (Decryption)
            pack.classList.add('shake');
            playSfx(100, 'sawtooth', 1, 0.2); // Low hum
            
            setTimeout(() => {
                // 2. Aşama: Patlama (The Burst)
                pack.classList.remove('shake');
                pack.style.display = 'none';
                burst.style.opacity = '1';
                burst.style.transform = 'scale(50)';
                burst.style.transition = 'transform 0.5s ease-out, opacity 0.5s ease-out';
                
                playSfx(800, 'square', 0.2, 0.3); // Pop sound
                playSfx(400, 'sine', 1.5, 0.1); // Afterglow sound

                setTimeout(() => {
                    burst.style.opacity = '0';
                    // 3. Aşama: Kartın Görünmesi
                    card.style.display = 'flex';
                    card.style.animation = 'scaleUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
                    
                    // 4. Aşama: Yönlendirme (Burayı istediğin linkle değiştir)
                    setTimeout(() => {
                        // Sitenin asıl encoder kısmına buradan gider
                        window.location.href = "#encoder"; 
                        alert("Erişim Onaylandı! Encoder modülüne aktarılıyorsunuz.");
                    }, 2000);
                }, 400);
            }, 1500); // 1.5 saniye sarsılır sonra patlar
        }
    </script>

    <style>
        @keyframes scaleUp {
            from { transform: scale(0) rotate(-10deg); opacity: 0; }
            to { transform: scale(1) rotate(0deg); opacity: 1; }
        }
    </style>
</body>
</html>
