<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | MENU</title>
    
    <link rel="icon" href="assets/img/icon.png" type="image/png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        :root {
            --neon-blue: #00d2ff;
            --neon-green: #00ff41;
            --text-gray: #888888;
            --bg-dark: #020202;
            --nav-bg: #0a0a0a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- YENİ WARP ARKA PLAN CANVAS --- */
        #canvas-warp {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1; /* En arkada */
            background: #000;
        }

        /* --- PROFESYONEL NAVBAR --- */
        .navbar {
            width: 100%; height: 80px;
            background: var(--nav-bg);
            border-bottom: 1px solid #1a1a1a;
            display: flex; align-items: center; padding: 0 40px;
            position: relative; z-index: 1000;
        }

        .nav-left { flex: 1; display: flex; align-items: center; }
        .main-logo { height: 60px; width: auto; filter: grayscale(0.5); transition: 0.3s; }

        .nav-center {
            position: absolute; left: 50%; transform: translateX(-50%); text-align: center;
        }
        .brand-text {
            font-size: 1.8rem; letter-spacing: 12px; font-weight: 700;
            color: var(--text-gray); text-transform: uppercase;
        }

        .nav-right {
            flex: 1; text-align: right; font-size: 11px; color: #444;
            letter-spacing: 2px; font-family: monospace;
        }

        /* --- MODÜLLER --- */
        main {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 50px; z-index: 10;
        }

        .pack {
            width: 300px; height: 440px; position: relative; cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .pack:hover { transform: translateY(-10px); }

        .card {
            position: absolute; inset: 0;
            background: rgba(8, 8, 8, 0.9); /* Arka planın hafif görünmesi için yarı saydam */
            border-radius: 20px; border: 1px solid #111;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1; backdrop-filter: blur(5px);
        }
        .card-img { width: 150px; filter: grayscale(0.2) drop-shadow(0 0 20px rgba(0, 210, 255, 0.2)); }

        /* Yırtılma Kaplaması */
        .foil {
            position: absolute; inset: -1px; z-index: 10;
            background: linear-gradient(135deg, #1a1a1a, #050505);
            border-radius: 20px; border: 1px solid #222;
            transition: 1.2s cubic-bezier(0.9, 0, 0.1, 1);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        .ripped .foil {
            clip-path: polygon(100% 100%, 100% 100%, 100% 100%, 100% 100%);
            opacity: 0; transform: scale(1.1);
        }

        /* --- LOADING OVERLAY --- */
        #loading-screen {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner {
            width: 60px; height: 60px; border: 3px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid var(--text-gray); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <canvas id="canvas-warp"></canvas>

    <nav class="navbar">
        <div class="nav-left">
            <img src="assets/img/logo.png" alt="Vantavigil" class="main-logo">
        </div>
        <div class="nav-center">
            <h1 class="brand-text">VANTAVIGIL</h1>
        </div>
        <div class="nav-right">
            STATUS: <span style="color:var(--neon-green)">ONLINE</span>
        </div>
    </nav>

    <main>
        <div class="pack" onclick="launchModule(this, '/vantavigil/encoder')">
            <div class="card">
                <img src="assets/img/logo.png" class="card-img" alt="Logo">
                <h2 style="margin-top:20px; letter-spacing:5px; color:var(--text-gray); font-size:1.2rem;">ENCODER</h2>
            </div>
            <div class="foil"></div>
        </div>
        <div class="pack" style="opacity: 0.1; cursor: not-allowed;">
            <div class="card"><h2 style="color:#222;">LOCKED</h2></div>
            <div class="foil"></div>
        </div>
    </main>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top:20px; letter-spacing:5px; color:var(--text-gray); font-size:12px;">INITIATING WARP JUMP...</p>
    </div>

    <script>
        // --- YENİ WARP DRIVE EFEKTİ SCRIPT ---
        const canvas = document.getElementById('canvas-warp');
        const ctx = canvas.getContext('2d');
        
        let width, height, cx, cy;
        let stars = [];
        const numStars = 400; // Yıldız sayısı
        const speed = 15;     // Hız faktörü

        class Star {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = (Math.random() - 0.5) * width * 2; // Geniş alana yay
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = Math.random() * width; // Derinlik
                this.pz = this.z; // Önceki Z konumu (çizgi için)
            }
            update() {
                this.pz = this.z; // Önceki konumu kaydet
                this.z -= speed;  // Bize doğru yaklaştır
                // Ekrandan çıkarsa arkaya at
                if (this.z < 1) {
                    this.reset();
                    this.z = width;
                    this.pz = this.z;
                }
            }
            draw() {
                // Perspektif hesaplaması
                const sx = (this.x / this.z) * cx + cx;
                const sy = (this.y / this.z) * cy + cy;
                
                // Önceki konumun perspektifi (çizgi kuyruğu için)
                const psx = (this.x / this.pz) * cx + cx;
                const psy = (this.y / this.pz) * cy + cy;

                // Yakınlaştıkça kalınlaşan ve parlayan çizgi
                const size = (1 - this.z / width) * 4;
                const opacity = (1 - this.z / width);

                ctx.beginPath();
                ctx.moveTo(psx, psy); // Kuyruk başlangıcı
                ctx.lineTo(sx, sy);   // Mevcut konum
                
                // Referans görseldeki gibi mavimsi beyaz renk
                ctx.strokeStyle = `rgba(200, 230, 255, ${opacity})`;
                ctx.lineWidth = size;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        }

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2; // Merkez X
            cy = height / 2; // Merkez Y
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)'; // Hafif iz bırakarak temizle (motion trail)
            ctx.fillRect(0, 0, width, height);
            
            for (const star of stars) {
                star.update();
                star.draw();
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init();
        animate();

        // --- UI RESET (GERİ TUŞU HATASI İÇİN) ---
        window.onpageshow = function(event) {
            document.getElementById('loading-screen').style.display = 'none';
            document.querySelectorAll('.pack').forEach(p => p.classList.remove('ripped'));
        };

        // --- PAKET AÇMA ---
        function launchModule(element, url) {
            if (element.classList.contains('ripped')) return;
            element.classList.add('ripped');
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'flex';
                setTimeout(() => {
                    window.location.href = url;
                }, 1800);
            }, 800);
        }
    </script>
</body>
</html>
