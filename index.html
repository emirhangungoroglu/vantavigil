<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | SECURE_ACCESS</title>
    
    <link rel="icon" href="assets/img/icon.png" type="image/png">

    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-green: #00ff41;
            --bg-dark: #020202;
            --nav-bg: rgba(5, 5, 5, 0.95);
            --panel-border: #1a1a1a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; background: var(--bg-dark); color: white;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- 4. PROFESYONEL NAVBAR --- */
        .navbar {
            width: 100%;
            background: var(--nav-bg);
            border-bottom: 1px solid var(--panel-border);
            padding: 0 40px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center; /* Merkeze sabitlemek için */
            z-index: 1000;
        }

        .nav-container {
            width: 100%;
            max-width: 1400px; /* Ekran dışına taşmayı önler */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-logo {
            height: 45px; /* Logo büyütüldü */
            width: auto;
            filter: drop-shadow(0 0 5px rgba(0, 210, 255, 0.3));
        }

        .brand-name {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 6px;
            color: #fff;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-family: monospace;
            color: var(--neon-green);
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 8px; height: 8px;
            background: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-green);
            animation: pulse 1.5s infinite;
        }

        /* --- ANA İÇERİK --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            perspective: 2000px;
        }

        /* --- PAKET TASARIMI --- */
        .pack-outer {
            width: 300px; height: 440px;
            position: relative; cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .pack-outer:hover { transform: scale(1.05) translateY(-10px); }

        /* KART İÇİ (REVEAL) */
        .module-card {
            position: absolute; inset: 0;
            background: #080808;
            border: 1px solid #222;
            border-radius: 20px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1;
        }

        /* 2. PAKET İÇİ LOGO (Büyütüldü) */
        .inner-logo {
            width: 140px; /* Profesyonel görünüm için büyütüldü */
            margin-bottom: 30px;
            filter: drop-shadow(0 0 15px var(--neon-blue));
            transition: 0.5s;
        }

        .card-label {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: var(--neon-blue);
        }

        /* FOIL (SOL ÜSTTEN YIRTILMA) */
        .foil {
            position: absolute; inset: -2px; z-index: 10;
            background: linear-gradient(145deg, #222, #050505);
            border: 2px solid #333; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            transition: all 1.2s cubic-bezier(0.9, 0, 0.1, 1);
        }

        /* YIRTILMA EFEKTİ */
        .pack-outer.ripping .foil {
            clip-path: polygon(100% 100%, 100% 100%, 100% 100%, 100% 100%);
            opacity: 0; transform: scale(1.2) rotate(5deg);
        }

        /* 3. PROFESYONEL LOADING --- */
        #loading-screen {
            position: fixed; inset: 0;
            background: var(--bg-dark);
            z-index: 9999; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .cyber-spinner {
            width: 80px; height: 80px;
            border: 3px solid rgba(0, 210, 255, 0.1);
            border-top: 3px solid var(--neon-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-msg {
            margin-top: 30px; font-family: monospace;
            letter-spacing: 5px; color: var(--neon-blue);
            font-size: 14px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* KİLİTLİ PANEL */
        .locked { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="brand">
                <img src="assets/img/logo.png" alt="Vantavigil" class="nav-logo">
                <span class="brand-name">VANTAVIGIL</span>
            </div>
            <div class="status-indicator">
                <div class="pulse-dot"></div>
                UPLINK_SECURE: 256-BIT
            </div>
        </div>
    </nav>

    <main>
        <div class="pack-outer" onclick="handleUnpack(this, '/vantavigil/encoder')">
            <div class="module-card">
                <img src="assets/img/logo.png" class="inner-logo" alt="Module Logo">
                <div class="card-label">ENCODER</div>
                <div style="font-size: 10px; color: #444; margin-top: 10px;">CORE_V1_DECRYPTION</div>
            </div>
            
            <div class="foil">
                <img src="assets/img/logo.png" style="width: 60px; opacity: 0.1; filter: contrast(0);" alt="Pack Logo">
            </div>
        </div>

        <div class="pack-outer locked">
            <div class="module-card">
                <img src="assets/img/logo.png" class="inner-logo">
                <div class="card-label">ROOT_ANALYZER</div>
            </div>
            <div class="foil"></div>
        </div>
    </main>

    <div id="loading-screen">
        <div class="cyber-spinner"></div>
        <p class="loading-msg">SYNCHRONIZING SECURE TUNNEL...</p>
        <div id="log-feed" style="font-size: 10px; color: #333; font-family: monospace; margin-top: 10px;"></div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playRipSfx() {
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
            }
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass'; filter.frequency.value = 1000;
            source.connect(filter); filter.connect(audioCtx.destination);
            source.start();
        }

        function handleUnpack(element, targetUrl) {
            if (element.classList.contains('ripping') || element.classList.contains('locked')) return;

            playRipSfx();
            element.classList.add('ripping');

            // 1.2 saniye sonra profesyonel loading ekranını aç
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.style.display = 'flex';
                
                const logFeed = document.getElementById('log-feed');
                const logs = ["Auth_Key Check...", "Bypassing Handshake...", "Kernel_Sync_Complete"];
                let step = 0;
                
                const logInterval = setInterval(() => {
                    logFeed.innerText = `> ${logs[step]}`;
                    step++;
                    if(step >= logs.length) clearInterval(logInterval);
                }, 600);

                // 2.5 saniye sonra asıl adrese yönlendir
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 2500);
            }, 1000);
        }
    </script>
</body>
</html>
