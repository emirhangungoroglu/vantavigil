<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | MODULE SELECTOR</title>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-green: #00ff41;
            --bg: #050505;
            --card-bg: #111;
        }

        body {
            margin: 0; background: var(--bg); color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }

        .header { margin-bottom: 50px; text-align: center; }
        .header h1 { letter-spacing: 10px; color: var(--neon-blue); text-shadow: 0 0 15px var(--neon-blue); }

        /* PANEL GRID */
        .module-grid {
            display: flex; gap: 30px; perspective: 1000px;
        }

        /* PAKET TASARIMI */
        .pack {
            width: 220px; height: 320px;
            position: relative; cursor: pointer;
            transition: transform 0.3s;
        }

        .pack:hover { transform: translateY(-10px); }

        /* YIRTILACAK ÜST KISIM */
        .pack-top {
            position: absolute; top: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(135deg, #222, #333);
            border: 1px solid #444; border-bottom: none;
            z-index: 5;
            display: flex; align-items: center; justify-content: center;
            /* Yırtılma efekti için jagged edge (tırtıklı alt kenar) */
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 85% 90%, 70% 100%, 50% 90%, 30% 100%, 15% 90%, 0% 100%);
            transition: transform 0.8s cubic-bezier(0.5, 0, 0.5, 1);
        }

        /* ALT KISIM (SABİT) */
        .pack-bottom {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(135deg, #222, #333);
            border: 1px solid #444; border-top: none;
            z-index: 4;
            clip-path: polygon(0% 0%, 15% 10%, 30% 0%, 50% 10%, 70% 0%, 85% 10%, 100% 0%, 100% 100%, 0% 100%);
        }

        /* İÇERİK (KART) */
        .content-card {
            position: absolute; top: 10%; left: 5%; width: 90%; height: 80%;
            background: #000; border: 1px solid var(--neon-blue);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2; transition: 0.5s;
        }

        /* YIRTILMA ANİMASYONU AKTİF */
        .pack.ripped .pack-top {
            transform: translateY(-150%) rotate(-10deg);
            opacity: 0;
        }

        .pack.ripped .content-card {
            border-color: var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green);
        }

        /* MODÜL BİLGİLERİ */
        .mod-title { font-weight: bold; letter-spacing: 2px; margin-top: 10px; }
        .mod-status { font-size: 10px; color: #666; }
        .lock-icon { font-size: 30px; opacity: 0.3; }

        /* KİLİTLİ PANEL */
        .locked { cursor: not-allowed; filter: grayscale(1); }

    </style>
</head>
<body>

    <div class="header">
        <h1>VANTAVIGIL</h1>
        <p style="color: #444;">SELECT SECURE MODULE</p>
    </div>

    <div class="module-grid">
        
        <div class="pack" onclick="tearPack(this, '/encoder')">
            <div class="pack-top"><span style="color:#555">SECURE</span></div>
            <div class="content-card">
                <div style="font-size: 40px;">⚡</div>
                <div class="mod-title">ENCODER</div>
                <div class="mod-status">ACTIVE_v1.0</div>
            </div>
            <div class="pack-bottom"></div>
        </div>

        <div class="pack locked" onclick="alert('Module encrypted. Stay tuned.')">
            <div class="pack-top"><span style="color:#555">LOCKED</span></div>
            <div class="content-card">
                <div class="lock-icon">🔒</div>
                <div class="mod-title">LOG_ANALYSIS</div>
                <div class="mod-status">COMING_SOON</div>
            </div>
            <div class="pack-bottom"></div>
        </div>

        <div class="pack locked">
            <div class="pack-top"><span style="color:#555">LOCKED</span></div>
            <div class="content-card">
                <div class="lock-icon">🔒</div>
                <div class="mod-title">INTEL_FEED</div>
                <div class="mod-status">COMING_SOON</div>
            </div>
            <div class="pack-bottom"></div>
        </div>

    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playRipSound() {
            const osc = audioCtx.createOscillator();
            const noise = audioCtx.createBufferSource();
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1000;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            noise.buffer = buffer;
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        function tearPack(element, targetUrl) {
            if (element.classList.contains('ripped')) return;

            playRipSound();
            element.classList.add('ripped');

            // 1.5 saniye sonra yönlendir
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 1500);
        }
    </script>
</body>
</html>
