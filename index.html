<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | SECURE_ACCESS</title>
    
    <link rel="icon" href="assets/img/icon.png" type="image/png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');

        :root {
            --neon-blue: #00d2ff;
            --neon-green: #00ff41;
            --bg-dark: #020202;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- PROFESYONEL NAVBAR (TAM MERKEZ VE DEV LOGO) --- */
        .navbar {
            width: 100%;
            height: 130px; /* Navbar derinliği artırıldı */
            background: rgba(0, 0, 0, 0.98);
            border-bottom: 2px solid #111;
            display: flex;
            align-items: center;
            padding: 0 60px;
            position: relative;
            z-index: 1000;
        }

        /* Sol: Dev Logo */
        .nav-left { flex: 1; display: flex; align-items: center; }
        .main-logo {
            height: 100px; /* Devasa Logo */
            width: auto;
            filter: drop-shadow(0 0 15px var(--neon-blue));
        }

        /* Orta: Tam Merkezlenmiş Profesyonel Yazı */
        .nav-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        .brand-text {
            font-size: 3rem; /* Çok daha büyük */
            letter-spacing: 20px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
            margin: 0;
        }

        .nav-right {
            flex: 1;
            text-align: right;
            font-size: 13px;
            color: var(--neon-green);
            letter-spacing: 2px;
            font-family: monospace;
        }

        /* --- MODÜLLER --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
        }

        .pack {
            width: 320px; height: 460px;
            position: relative; cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .pack:hover { transform: translateY(-15px) scale(1.03); }

        .card {
            position: absolute; inset: 0;
            background: #080808; border-radius: 30px;
            border: 1px solid #1a1a1a;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1;
        }
        .card-img { width: 180px; filter: drop-shadow(0 0 25px var(--neon-blue)); }

        /* Yırtılma Kaplaması */
        .foil {
            position: absolute; inset: -1px; z-index: 10;
            background: linear-gradient(145deg, #222, #000);
            border-radius: 30px; border: 2px solid #333;
            transition: 1.2s cubic-bezier(0.9, 0, 0.1, 1);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        /* Yırtılma Efekti */
        .ripped .foil {
            clip-path: polygon(100% 100%, 100% 100%, 100% 100%, 100% 100%);
            opacity: 0; transform: scale(1.15) rotate(5deg);
        }

        /* --- LOADING OVERLAY --- */
        #loading-screen {
            position: fixed; inset: 0;
            background: #000; z-index: 9999;
            display: none; /* JS ile açılacak */
            flex-direction: column; align-items: center; justify-content: center;
        }

        .spinner {
            width: 80px; height: 80px;
            border: 4px solid rgba(0, 210, 255, 0.05);
            border-top: 4px solid var(--neon-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <img src="assets/img/logo.png" alt="Vantavigil" class="main-logo">
        </div>
        
        <div class="nav-center">
            <h1 class="brand-text">VANTAVIGIL</h1>
        </div>

        <div class="nav-right">
            UPLINK: <span style="color:white">ESTABLISHED</span>
        </div>
    </nav>

    <main>
        <div class="pack" onclick="launchModule(this, '/vantavigil/encoder')">
            <div class="card">
                <img src="assets/img/logo.png" class="card-img" alt="Logo">
                <h2 style="margin-top:25px; letter-spacing:8px; color:var(--neon-blue); font-size:1.5rem;">ENCODER</h2>
            </div>
            <div class="foil"></div>
        </div>
        
        <div class="pack" style="opacity: 0.2; cursor: not-allowed;">
            <div class="card"><h2 style="color:#222;">ENCRYPTED</h2></div>
            <div class="foil"></div>
        </div>
    </main>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top:30px; letter-spacing:8px; color:var(--neon-blue); font-size:14px;">CONNECTING TO VANTAVIGIL CORE...</p>
    </div>

    <script>
        /**
         * GERİ TUŞU HATASINI ÇÖZEN KRİTİK KOD
         * Tarayıcı "Geri" tuşuyla gelirse veya sayfa her yüklendiğinde
         * loading ekranını zorla kapatır ve kartları resetler.
         */
        function resetPage() {
            document.getElementById('loading-screen').style.display = 'none';
            document.querySelectorAll('.pack').forEach(p => {
                p.classList.remove('ripped');
            });
        }

        // Sayfa yüklendiğinde ve geri tuşuna basıldığında çalışır
        window.addEventListener('pageshow', resetPage);
        window.addEventListener('load', resetPage);

        function launchModule(element, url) {
            if (element.classList.contains('ripped')) return;

            // Ses motorunu başlat (tarayıcı izni için)
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // 1. Yırtılma Animasyonu
            element.classList.add('ripped');

            setTimeout(() => {
                // 2. Loading Overlay'i göster
                document.getElementById('loading-screen').style.display = 'flex';

                setTimeout(() => {
                    // 3. Yönlendirme (Geçmişi kirletmemesi için replace kullanıyoruz)
                    window.location.replace(url);
                }, 2200);
            }, 1000);
        }
    </script>
</body>
</html>
