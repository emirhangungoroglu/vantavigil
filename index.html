<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | SECURE_ACCESS</title>
    
    <link rel="icon" href="assets/img/icon.png" type="image/png">

    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-green: #00ff41;
            --cyber-red: #ff003c;
            --bg-dark: #020202;
            --panel-bg: #0a0a0a;
        }

        body {
            margin: 0; background: var(--bg-dark); color: white;
            font-family: 'Segoe UI', 'Courier New', monospace;
            height: 100vh; overflow: hidden; perspective: 1500px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* 4. NAVBAR / HEADER DÜZENLEMESİ */
        .vantavigil-nav {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 15px 30px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid #1a1a1a;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 100;
        }

        .brand-box { display: flex; align-items: center; gap: 15px; }
        .brand-logo-nav { height: 30px; width: auto; }
        .brand-text { font-size: 1.2rem; font-weight: 900; letter-spacing: 4px; color: white; }
        .sys-status { font-size: 12px; color: var(--neon-green); font-family: monospace; }

        /* PANEL VE PAKET TASARIMI */
        .container { display: flex; gap: 50px; z-index: 5; margin-top: 50px; }

        .pack-wrapper {
            width: 280px; height: 400px; position: relative; cursor: pointer;
            transition: transform 0.4s ease;
        }
        .pack-wrapper:hover { transform: scale(1.05) translateY(-10px); }

        /* KART İÇERİĞİ */
        .module-card {
            position: absolute; inset: 0; background: var(--panel-bg);
            border: 1px solid #222; border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* 2. LOGO EKLEME (KART İÇİ) */
        .card-logo { width: 100px; margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--neon-blue)); }

        .module-label { font-weight: bold; letter-spacing: 2px; color: var(--neon-blue); }

        /* FOIL (YIRTILACAK KAPAK) */
        .foil-cover {
            position: absolute; inset: -1px; z-index: 10;
            background: linear-gradient(135deg, #1a1a1a 0%, #333 50%, #1a1a1a 100%);
            border-radius: 15px; border: 2px solid #333;
            display: flex; align-items: center; justify-content: center;
            transition: all 1s cubic-bezier(0.9, 0, 0.1, 1);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        /* YIRTILMA EFEKTİ */
        .pack-wrapper.ripping .foil-cover {
            clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
            opacity: 0; transform: scale(1.1);
        }

        /* 3. LOADING EKRANI (DÖNEN ŞEY) */
        #loading-overlay {
            position: fixed; inset: 0; background: var(--bg-dark);
            display: none; flex-direction: column; align-items: center;
            justify-content: center; z-index: 9999;
        }

        .spinner {
            width: 60px; height: 60px;
            border: 4px solid rgba(0, 210, 255, 0.1);
            border-left-color: var(--neon-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text { margin-top: 20px; font-family: monospace; letter-spacing: 3px; color: var(--neon-blue); }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* KİLİTLİ PANEL */
        .locked { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }

    </style>
</head>
<body>

    <nav class="vantavigil-nav">
        <div class="brand-box">
            <img src="assets/img/logo.png" alt="Vantavigil Logo" class="brand-logo-nav">
            <span class="brand-text">VANTAVIGIL</span>
        </div>
        <div class="sys-status">SECURE_CONNECTION: ACTIVE</div>
    </nav>

    <div class="container">
        
        <div class="pack-wrapper" onclick="startUnpack(this, '/vantavigil/encoder')">
            <div class="module-card">
                <img src="assets/img/logo.png" class="card-logo" alt="Logo">
                <div class="module-label">ENCODER_v1</div>
                <div style="font-size: 10px; color: #555; margin-top: 10px;">DECRYPTION MODULE</div>
            </div>
            
            <div class="foil-cover">
                <img src="assets/img/logo.png" style="width: 50px; opacity: 0.2; filter: grayscale(1);" alt="Pack Logo">
            </div>
        </div>

        <div class="pack-wrapper locked">
            <div class="module-card">
                <img src="assets/img/logo.png" class="card-logo" style="opacity:0.2;">
                <div class="module-label">ROOT_SCAN</div>
            </div>
            <div class="foil-cover"></div>
        </div>

    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p class="loading-text">DECRYPTING MODULE...</p>
        <p id="dynamic-log" style="font-size: 10px; color: #333; font-family: monospace;"></p>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playRipSound() {
            const bufferSize = audioCtx.sampleRate * 0.4;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        function startUnpack(element, targetUrl) {
            if (element.classList.contains('ripping')) return;

            playRipSound();
            element.classList.add('ripping');

            // 1.5 saniye sonra loading ekranına geç
            setTimeout(() => {
                const overlay = document.getElementById('loading-overlay');
                overlay.style.display = 'flex';
                
                // Sahte loglar döndür
                const logs = ["Accessing Kernel...", "Bypassing Handshake...", "Syncing Assets..."];
                let i = 0;
                const logInterval = setInterval(() => {
                    document.getElementById('dynamic-log').innerText = `> ${logs[i]}`;
                    i++;
                    if(i >= logs.length) clearInterval(logInterval);
                }, 500);

                // 2.5 saniye loading dönüp yönlendir
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 2500);
            }, 1200);
        }
    </script>
</body>
</html>
