<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | SECURE_ACCESS</title>
    
    <link rel="icon" href="assets/img/icon.png" type="image/png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');

        :root {
            --neon-blue: #00d2ff;
            --neon-green: #00ff41;
            --bg-dark: #020202;
            --nav-bg: rgba(0, 0, 0, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- PROFESYONEL NAVBAR --- */
        .navbar {
            width: 100%;
            height: 120px; /* Navbar biraz daha genişletildi */
            background: var(--nav-bg);
            border-bottom: 2px solid #111;
            display: flex;
            align-items: center;
            padding: 0 40px;
            position: relative;
        }

        /* Sol Logo: Devasa Boyut */
        .nav-left {
            flex: 1;
        }
        .main-logo {
            height: 90px; /* İstediğin gibi büyütüldü */
            width: auto;
            filter: drop-shadow(0 0 15px var(--neon-blue));
        }

        /* Orta Yazı: Tam Merkez ve Profesyonel */
        .nav-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }
        .brand-text {
            font-size: 2.8rem; /* Büyük ve etkileyici */
            letter-spacing: 18px;
            font-weight: 900;
            background: linear-gradient(to bottom, #fff, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
        }

        .nav-right {
            flex: 1;
            text-align: right;
            font-size: 12px;
            color: var(--neon-green);
            letter-spacing: 2px;
        }

        /* --- MODÜLLER --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }

        .pack {
            width: 320px; height: 460px;
            position: relative; cursor: pointer;
            transition: 0.4s;
        }
        .pack:hover { transform: translateY(-10px) scale(1.02); }

        .card {
            position: absolute; inset: 0;
            background: #080808; border-radius: 25px;
            border: 1px solid #222;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1;
        }

        .card-img { width: 180px; filter: drop-shadow(0 0 20px var(--neon-blue)); }

        /* Yırtılma Kaplaması */
        .foil {
            position: absolute; inset: -1px; z-index: 10;
            background: linear-gradient(135deg, #1a1a1a, #000);
            border-radius: 25px; border: 2px solid #333;
            transition: 1s cubic-bezier(0.9, 0, 0.1, 1);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        .ripped .foil {
            clip-path: polygon(100% 100%, 100% 100%, 100% 100%, 100% 100%);
            opacity: 0; transform: scale(1.1);
        }

        /* --- LOADING OVERLAY --- */
        #loading-screen {
            position: fixed; inset: 0;
            background: #000; z-index: 9999;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
        }

        .spinner {
            width: 100px; height: 100px;
            border: 4px solid rgba(0, 210, 255, 0.1);
            border-top: 4px solid var(--neon-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <img src="assets/img/logo.png" alt="Vantavigil" class="main-logo">
        </div>
        
        <div class="nav-center">
            <h1 class="brand-text">VANTAVIGIL</h1>
        </div>

        <div class="nav-right">
            SYSTEM_STATUS: <span style="color:white">ONLINE</span>
        </div>
    </nav>

    <main>
        <div class="pack" id="encoder-module" onclick="launchModule(this, '/vantavigil/encoder')">
            <div class="card">
                <img src="assets/img/logo.png" class="card-img" alt="Logo">
                <h2 style="margin-top:20px; letter-spacing:5px; color:var(--neon-blue);">ENCODER</h2>
            </div>
            <div class="foil"></div>
        </div>
        
        <div class="pack" style="opacity: 0.3; cursor: not-allowed;">
            <div class="card"><h2 style="color:#333;">LOCKED</h2></div>
            <div class="foil"></div>
        </div>
    </main>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top:30px; letter-spacing:5px; color:var(--neon-blue);">ESTABLISHING SECURE UPLINK...</p>
    </div>

    <script>
        // Geri tuşu kontrolü: Eğer kullanıcı geri gelirse yükleme ekranını göstermeden içeriği aç
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                window.location.reload(); // Sayfayı temizle
            }
        });

        function launchModule(element, url) {
            if (element.classList.contains('ripped')) return;

            // Yırtılma Animasyonu
            element.classList.add('ripped');

            setTimeout(() => {
                // Loading Overlay'i göster
                document.getElementById('loading-screen').style.display = 'flex';

                setTimeout(() => {
                    // KRİTİK NOKTA: window.location.replace kullanıyoruz!
                    // Bu sayede tarayıcı geçmişine bu loading sayfası eklenmez.
                    window.location.replace(url);
                }, 2000);
            }, 800);
        }
    </script>
</body>
</html>
