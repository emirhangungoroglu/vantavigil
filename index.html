<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | MENU</title>
    
    <link rel="icon" href="assets/img/icon.png" type="image/png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        :root {
            --neon-blue: #00d2ff;
            --neon-green: #00ff41;
            --text-gray: #888888;
            --bg-dark: #020202;
            --nav-bg: rgba(10, 10, 10, 0.96);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-dark) url('assets/img/background.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- NAVBAR --- */
        .navbar {
            width: 100%; height: 80px;
            background: var(--nav-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; padding: 0 40px;
            position: relative; z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-left { flex: 1; display: flex; align-items: center; }
        .main-logo { height: 60px; width: auto; filter: grayscale(0.4); transition: 0.3s; }

        .nav-center {
            position: absolute; left: 50%; transform: translateX(-50%); text-align: center;
        }
        .brand-text {
            font-size: 1.8rem; letter-spacing: 12px; font-weight: 700;
            color: var(--text-gray); text-transform: uppercase;
        }

        .nav-right {
            flex: 1; text-align: right; font-size: 11px; color: #555;
            letter-spacing: 2px; font-family: monospace;
        }

        /* --- MODÜL PANELLERİ (5'Lİ SİSTEM) --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px; /* Kartlar arası boşluk biraz daraltıldı */
            z-index: 10;
            padding: 0 20px;
        }

        .pack {
            /* Kart boyutları küçültüldü */
            width: 210px; 
            height: 320px; 
            position: relative; 
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .pack:not(.locked):hover { transform: translateY(-10px) scale(1.02); }

        .card {
            position: absolute; inset: 0;
            background: rgba(8, 8, 8, 0.92);
            border-radius: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1; backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
        }

        .card-img { 
            width: 100px; /* Görsel boyutu kartla orantılı küçültüldü */
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.2)); 
        }

        .card-title {
            margin-top: 15px; 
            letter-spacing: 3px; 
            color: var(--text-gray); 
            font-size: 1rem;
        }

        /* Kilitli Kart Ayarları */
        .pack.locked {
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .pack.locked .card {
            background: rgba(5, 5, 5, 0.98);
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .lock-text {
            color: #222;
            font-size: 0.7rem;
            letter-spacing: 2px;
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* YIRTILMA KAPLAMASI (FOIL) */
        .foil {
            position: absolute; inset: -1px; z-index: 10;
            background: linear-gradient(135deg, #1a1a1a, #050505);
            border-radius: 15px; border: 1px solid #222;
            transition: 1.2s cubic-bezier(0.9, 0, 0.1, 1);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        .ripped .foil {
            clip-path: polygon(100% 100%, 100% 100%, 100% 100%, 100% 100%);
            opacity: 0; transform: scale(1.1) rotate(5deg);
        }

        /* --- LOADING OVERLAY --- */
        #loading-screen {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner {
            width: 50px; height: 50px; border: 3px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid var(--neon-blue); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <img src="assets/img/logo.png" alt="Vantavigil" class="main-logo">
        </div>
        <div class="nav-center">
            <h1 class="brand-text">VANTAVIGIL</h1>
        </div>
        <div class="nav-right">
            STATUS: <span style="color:var(--neon-green)">ONLINE</span>
        </div>
    </nav>

    <main>
        <div class="pack" onclick="launchModule(this, '/vantavigil/encoder')">
            <div class="card">
                <img src="assets/img/logo.png" class="card-img" alt="Logo">
                <h2 class="card-title">ENCODER</h2>
            </div>
            <div class="foil"></div>
        </div>
        
        <div class="pack locked">
            <div class="card">
                <img src="assets/img/logo.png" class="card-img" style="opacity: 0.05;" alt="Logo">
                <div class="lock-text">ENCRYPTED</div>
            </div>
            <div class="foil"></div>
        </div>

        <div class="pack locked">
            <div class="card">
                <img src="assets/img/logo.png" class="card-img" style="opacity: 0.05;" alt="Logo">
                <div class="lock-text">ENCRYPTED</div>
            </div>
            <div class="foil"></div>
        </div>

        <div class="pack locked">
            <div class="card">
                <img src="assets/img/logo.png" class="card-img" style="opacity: 0.05;" alt="Logo">
                <div class="lock-text">ENCRYPTED</div>
            </div>
            <div class="foil"></div>
        </div>

        <div class="pack locked">
            <div class="card">
                <img src="assets/img/logo.png" class="card-img" style="opacity: 0.05;" alt="Logo">
                <div class="lock-text">ENCRYPTED</div>
            </div>
            <div class="foil"></div>
        </div>
    </main>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top:20px; letter-spacing:5px; color:var(--neon-blue); font-size:10px;">AUTHORIZING ACCESS...</p>
    </div>

    <script>
        function resetUI() {
            document.getElementById('loading-screen').style.display = 'none';
            document.querySelectorAll('.pack').forEach(p => p.classList.remove('ripped'));
        }

        window.onpageshow = function(event) { resetUI(); };
        window.onload = function() { resetUI(); };

        function launchModule(element, url) {
            if (element.classList.contains('ripped') || element.classList.contains('locked')) return;
            element.classList.add('ripped');
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'flex';
                setTimeout(() => {
                    window.location.href = url;
                }, 1800);
            }, 800);
        }
    </script>
</body>
</html>
