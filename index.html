<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | SECURE_ACCESS</title>
    
    <link rel="icon" href="assets/img/icon.png" type="image/png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');

        :root {
            --neon-blue: #00d2ff;
            --neon-green: #00ff41;
            --bg-dark: #020202;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- PROFESYONEL NAVBAR (TAM MERKEZ VE DEV LOGO) --- */
        .navbar {
            width: 100%;
            height: 140px; /* Navbar derinliği ideal seviyede */
            background: rgba(0, 0, 0, 0.98);
            border-bottom: 2px solid #1a1a1a;
            display: flex;
            align-items: center;
            padding: 0 60px;
            position: relative;
            z-index: 1000;
        }

        /* Sol: Dev Logo */
        .nav-left { flex: 1; display: flex; align-items: center; }
        .main-logo {
            height: 110px; /* İstediğin gibi devasa yapıldı */
            width: auto;
            filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.4));
        }

        /* Orta: Tam Merkezlenmiş Profesyonel Yazı */
        .nav-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 60%;
        }
        .brand-text {
            font-size: 3.5rem; /* Devasa ve profesyonel font boyutu */
            letter-spacing: 25px; /* Kurumsal boşluklandırma */
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(0, 210, 255, 0.5);
            margin: 0;
            display: inline-block;
        }

        .nav-right {
            flex: 1;
            text-align: right;
            font-size: 14px;
            color: var(--neon-green);
            letter-spacing: 3px;
            font-family: monospace;
            text-shadow: 0 0 10px var(--neon-green);
        }

        /* --- MODÜLLER --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
        }

        .pack {
            width: 320px; height: 460px;
            position: relative; cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .pack:hover { transform: translateY(-20px) scale(1.05); }

        .card {
            position: absolute; inset: 0;
            background: #080808; border-radius: 30px;
            border: 1px solid #1a1a1a;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        .card-img { width: 190px; filter: drop-shadow(0 0 30px var(--neon-blue)); }

        /* Yırtılma Kaplaması (Sol Üstten Sağa) */
        .foil {
            position: absolute; inset: -2px; z-index: 10;
            background: linear-gradient(145deg, #222, #000);
            border-radius: 30px; border: 2px solid #333;
            transition: 1.2s cubic-bezier(0.9, 0, 0.1, 1);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        .ripped .foil {
            clip-path: polygon(100% 100%, 100% 100%, 100% 100%, 100% 100%);
            opacity: 0; transform: scale(1.2) rotate(5deg);
        }

        /* --- LOADING OVERLAY --- */
        #loading-screen {
            position: fixed; inset: 0;
            background: #000; z-index: 9999;
            display: none; 
            flex-direction: column; align-items: center; justify-content: center;
        }

        .spinner {
            width: 90px; height: 90px;
            border: 5px solid rgba(0, 210, 255, 0.05);
            border-top: 5px solid var(--neon-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <img src="assets/img/logo.png" alt="Vantavigil" class="main-logo">
        </div>
        
        <div class="nav-center">
            <h1 class="brand-text">VANTAVIGIL</h1>
        </div>

        <div class="nav-right">
            NETWORK: <span style="color:white">SECURED</span>
        </div>
    </nav>

    <main>
        <div class="pack" onclick="launchModule(this, '/vantavigil/encoder')">
            <div class="card">
                <img src="assets/img/logo.png" class="card-img" alt="Logo">
                <h2 style="margin-top:30px; letter-spacing:10px; color:var(--neon-blue); font-size:1.6rem;">ENCODER</h2>
            </div>
            <div class="foil"></div>
        </div>
        
        <div class="pack" style="opacity: 0.15; cursor: not-allowed;">
            <div class="card"><h2 style="color:#222; letter-spacing: 5px;">LOCKED</h2></div>
            <div class="foil"></div>
        </div>
    </main>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top:40px; letter-spacing:10px; color:var(--neon-blue); font-size:16px;">ACCESSING SECURE DATA PACK...</p>
    </div>

    <script>
        /**
         * GERİ TUŞU DÖNGÜSÜNÜ KIRAN SİHİRLİ KOD
         */
        function forceResetUI() {
            // Sayfa yüklendiğinde veya geri gelindiğinde loading'i gizle
            document.getElementById('loading-screen').style.display = 'none';
            // Yırtılmış paketleri eski haline getir
            document.querySelectorAll('.pack').forEach(p => {
                p.classList.remove('ripped');
            });
        }

        // Sayfa her gösterildiğinde (geri tuşu dahil) UI'ı sıfırla
        window.onpageshow = function(event) {
            forceResetUI();
        };

        // Sayfa ilk yüklendiğinde UI'ı sıfırla
        window.onload = forceResetUI;

        function launchModule(element, url) {
            if (element.classList.contains('ripped')) return;

            // 1. Yırtılma Animasyonunu Başlat
            element.classList.add('ripped');

            // 2. Kısa bir bekleme sonrası Loading ekranını aç
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'flex';

                // 3. Yönlendirme yap
                setTimeout(() => {
                    // href kullanıyoruz çünkü kullanıcı geri geldiğinde bu sayfayı görmeli
                    // ama resetPage fonksiyonumuz sayesinde donmuş değil, taze halini görecek.
                    window.location.href = url;
                }, 2000);
            }, 800);
        }
    </script>
</body>
</html>
