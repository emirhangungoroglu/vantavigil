<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | SECURE_UNPACK</title>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-green: #00ff41;
            --dark-foil: #1a1a1a;
            --terminal-bg: #050505;
        }

        body {
            margin: 0; background: var(--terminal-bg); color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; perspective: 1500px;
        }

        /* Üst Header - Senin Tasarımına Uygun */
        .terminal-header {
            position: absolute; top: 20px; left: 20px; width: calc(100% - 40px);
            display: flex; justify-content: space-between; border-bottom: 1px solid #222;
            padding-bottom: 10px; font-size: 14px; color: var(--neon-green);
        }

        .container { display: flex; gap: 50px; z-index: 5; }

        /* ANA PAKET YAPISI */
        .pack-wrapper {
            width: 280px; height: 420px; position: relative; cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pack-wrapper:hover { transform: scale(1.05) rotateX(5deg); }

        /* ALT KATMAN (MODÜL KARTI) */
        .module-card {
            position: absolute; inset: 0; background: #000;
            border: 2px solid #333; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1; transition: 0.5s; overflow: hidden;
        }

        .module-card .icon { font-size: 60px; filter: drop-shadow(0 0 15px var(--neon-blue)); }
        .module-card .label { margin-top: 20px; font-weight: bold; letter-spacing: 3px; color: var(--neon-blue); }

        /* ÜST KATMAN (YIRTILACAK FOYLE) */
        .foil-cover {
            position: absolute; inset: -2px; z-index: 10;
            background: linear-gradient(145deg, #222, #000);
            border: 2px solid #444; border-radius: 12px;
            pointer-events: none;
            /* Yırtılma başlangıç maskesi */
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            transition: all 1s cubic-bezier(0.9, 0, 0.1, 1);
        }

        /* YIRTILMA ANİMASYONU (SOL ÜSTTEN BAŞLAYAN) */
        .pack-wrapper.ripping .foil-cover {
            /* Sol üstten sağ alta doğru yırtılma efekti */
            clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
            transform: translateX(20px) rotateY(10deg);
            opacity: 0;
        }

        /* YIRTILMA SIRASINDAKİ IŞIK PATLAMASI */
        .glow-flash {
            position: absolute; inset: 0; background: white;
            z-index: 15; opacity: 0; border-radius: 12px;
            pointer-events: none;
        }

        .pack-wrapper.ripping .glow-flash {
            animation: flashAnim 0.8s ease-out forwards;
        }

        @keyframes flashAnim {
            0% { opacity: 0; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(1.2); }
        }

        /* SARSILMA (GERİLİM) ANİMASYONU */
        .shake-tension { animation: shake 0.15s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -2px); }
            100% { transform: translate(1px, 2px); }
        }

        /* KİLİTLİ PANELLER */
        .locked-card { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; }

    </style>
</head>
<body>

    <div class="terminal-header">
        <div>root@portfolio:~$ ./Emirhan_Gungoroglu</div>
        <div>VPN: <span style="color:var(--neon-blue)">ENCRYPTED</span> | LOC: IST</div>
    </div>

    <div class="container">
        
        <div class="pack-wrapper" id="encoder-pack" onclick="handleUnpack(this, '/vantavigil/encoder')">
            <div class="module-card">
                <div class="icon">⚡</div>
                <div class="label">ENCODER</div>
                <div style="font-size: 10px; color: #555; margin-top: 5px;">DECRYPTION_READY</div>
            </div>
            
            <div class="foil-cover">
                <div style="height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column;">
                    <span style="font-size: 40px; color:#333; font-weight:bold;">V</span>
                    <span style="font-size: 10px; color:#444; margin-top:10px;">TOP_SECRET_PACKAGE</span>
                </div>
            </div>

            <div class="glow-flash"></div>
        </div>

        <div class="pack-wrapper locked-card">
            <div class="module-card">
                <div class="icon">🔒</div>
                <div class="label">BRUTE_FORCE</div>
            </div>
            <div class="foil-cover"></div>
        </div>

    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Daha "Kirli" ve "Fiziksel" Yırtılma Sesi
        function playTearSound() {
            const bufferSize = audioCtx.sampleRate * 0.4;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                // Brown noise + crackle kombinasyonu
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 500;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        function handleUnpack(element, redirectUrl) {
            if (element.classList.contains('ripping')) return;

            // 1. AŞAMA: Tıklama anında sarsılma başlar (Tension)
            element.classList.add('shake-tension');
            
            // Kısa bir gerilim beklemesi
            setTimeout(() => {
                element.classList.remove('shake-tension');
                
                // 2. AŞAMA: Yırtılma ve Ses
                playTearSound();
                element.classList.add('ripping');

                // 3. AŞAMA: Reveal ve Yönlendirme
                setTimeout(() => {
                    // Sayfayı karart ve yönlendir
                    document.body.style.transition = "1s";
                    document.body.style.background = "#00ff41";
                    document.body.style.opacity = "0";
                    
                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 1000);
                }, 2000);
            }, 400); 
        }
    </script>
</body>
</html>
