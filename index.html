<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | Professional Encoding Suite</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <img src="assets/img/logo.png" alt="Vantavigil Logo" class="nav-logo">
            <span class="brand-name">VANTAVIGIL</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">Encoder</a>
            <a href="https://emirhangungoroglu.github.io/about">About</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <header class="tool-header">
                <div class="status-bar">
                    <span class="status-dot"></span>
                    <span class="status-text">ENCRYPTION ENGINE // READY</span>
                </div>
                <h1>CYBER ENCODER SUITE</h1>
            </header>

            <main>
                <div class="workspace-grid">
                    <div class="editor-box">
                        <div class="box-header">INPUT_SOURCE</div>
                        <textarea id="userInput" placeholder="Waiting for raw data..."></textarea>
                        <span id="detectedFormat" class="detect-tag">Type: Unknown</span>
                    </div>

                    <div class="editor-box">
                        <div class="box-header">OUTPUT_RESULT</div>
                        <textarea id="outputData" readonly placeholder="Calculated output..."></textarea>
                        <button id="copyBtn" class="action-btn copy-btn">COPY TO CLIPBOARD</button>
                    </div>
                </div>

                <div class="control-panel">
                    <div class="select-container">
                        <label>ALGORITHM_SELECT</label>
                        <select id="operationType">
                            <option value="base64">Base64 (UTF-8)</option>
                            <option value="hex">Hexadecimal</option>
                            <option value="binary">Binary</option>
                            <option value="url">URL Encode</option>
                        </select>
                    </div>
                    <div class="btn-group">
                        <button id="encodeBtn" class="cyber-btn encode">RUN ENCODE</button>
                        <button id="decodeBtn" class="cyber-btn decode">RUN DECODE</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <footer class="main-footer">
        <p>&copy; 2025 Vantavigil Corp. // Secure Client-Side Environment // Emirhan Gungoroglu</p>
    </footer>

    <script src="assets/js/modules.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
