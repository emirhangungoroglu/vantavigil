<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | Professional Encoding Suite</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <img src="assets/img/logo.png" alt="Vantavigil Logo" class="nav-logo">
            <span class="brand-name">VANTAVIGIL</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">Encoder</a>
            <a href="https://emirhangungoroglu.github.io/about">About</a>
            <a href="https://emirhangungoroglu.github.io/projects">Services</a>
            <a href="https://emirhangungoroglu.github.io/contact">Contact</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <header class="tool-header">
                <div class="status-bar">
                    <span class="status-dot"></span>
                    <span class="status-text">SYSTEM SECURE // ENCRYPTION ACTIVE</span>
                </div>
                <h1>CYBER ENCODER SUITE</h1>
            </header>

            <main>
                <div class="workspace-grid">
                    <div class="editor-box">
                        <div class="label-row">
                            <label>INPUT SOURCE</label>
                            <span id="detectedFormat" class="detect-tag">Waiting for input...</span>
                        </div>
                        <textarea id="userInput" placeholder="Paste raw data for instant analysis..."></textarea>
                    </div>

                    <div class="editor-box">
                        <div class="label-row">
                            <label>OUTPUT RESULT</label>
                        </div>
                        <textarea id="outputData" readonly placeholder="Result will appear here..."></textarea>
                    </div>
                </div>

                <div class="controls">
                    <div class="select-wrapper">
                        <select id="operationType">
                            <option value="base64">Base64 (UTF-8)</option>
                            <option value="hex">Hexadecimal</option>
                            <option value="binary">Binary</option>
                            <option value="url">URL Encode</option>
                        </select>
                    </div>
                    <button id="encodeBtn" class="primary-btn">ENCODE</button>
                    <button id="decodeBtn" class="primary-btn">DECODE</button>
                </div>
                
                <button id="copyBtn" class="copy-btn">COPY TO CLIPBOARD</button>
            </main>
        </div>
    </div>

    <footer class="main-footer">
        <div class="footer-content">
            <div class="footer-left">
                <span class="footer-title">VANTAVIGIL SECURITY OPERATIONS</span>
                <p>Client-side processing only. Security is not an option, it's a standard.</p>
            </div>
            <div class="footer-right">
                <span class="copyright">&copy; 2025 Vantavigil Corp. // Developed by Emirhan Gungoroglu</span>
            </div>
        </div>
    </footer>

    <script src="assets/js/modules.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
