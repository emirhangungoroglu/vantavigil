<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | MENU</title>
    
    <link rel="icon" href="assets/img/icon.png" type="image/png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;600&display=swap');

        :root {
            --neon-blue: #00d2ff;
            --neon-green: #00ff41;
            --text-gray: #888888; 
            --bg-dark: #020202;
            --nav-bg: #0a0a0a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- DINAMIK ARKA PLAN CANVAS --- */
        #canvas-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle, #0a0a0a 0%, #020202 100%);
        }

        /* --- PROFESYONEL GRIMSI NAVBAR --- */
        .navbar {
            width: 100%;
            height: 80px;
            background: var(--nav-bg);
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            padding: 0 40px;
            position: relative;
            z-index: 1000;
        }

        .nav-left { flex: 1; display: flex; align-items: center; }
        .main-logo {
            height: 60px; /* Navbar ile uyumlu ama baskın */
            width: auto;
            filter: grayscale(0.5);
            transition: 0.3s;
        }

        .nav-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        .brand-text {
            font-size: 1.8rem;
            letter-spacing: 12px;
            font-weight: 700;
            color: var(--text-gray); /* İstediğin Gri Yazı */
            text-transform: uppercase;
        }

        .nav-right {
            flex: 1;
            text-align: right;
            font-size: 11px;
            color: #444;
            letter-spacing: 2px;
            font-family: monospace;
        }

        /* --- PANEL / MODÜL TASARIMI --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            z-index: 5;
        }

        .pack {
            width: 300px; height: 440px;
            position: relative; cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .pack:hover { transform: translateY(-10px); }

        .card {
            position: absolute; inset: 0;
            background: rgba(8, 8, 8, 0.9); /* Arka planın hafif görünmesi için */
            border-radius: 20px;
            border: 1px solid #111;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1;
            backdrop-filter: blur(5px);
        }
        .card-img { width: 150px; filter: grayscale(0.2) drop-shadow(0 0 20px rgba(0, 210, 255, 0.2)); }

        /* YIRTILMA KAPLAMASI (FOIL) */
        .foil {
            position: absolute; inset: -1px; z-index: 10;
            background: linear-gradient(135deg, #1a1a1a, #050505);
            border-radius: 20px; border: 1px solid #222;
            transition: 1.2s cubic-bezier(0.9, 0, 0.1, 1);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        .ripped .foil {
            clip-path: polygon(100% 100%, 100% 100%, 100% 100%, 100% 100%);
            opacity: 0; transform: scale(1.1) rotate(5deg);
        }

        /* --- LOADING OVERLAY --- */
        #loading-screen {
            position: fixed; inset: 0;
            background: #000; z-index: 9999;
            display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .spinner {
            width: 60px; height: 60px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid var(--text-gray);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <nav class="navbar">
        <div class="nav-left">
            <img src="assets/img/logo.png" alt="Vantavigil" class="main-logo">
        </div>
        
        <div class="nav-center">
            <h1 class="brand-text">VANTAVIGIL</h1>
        </div>

        <div class="nav-right">
            UPLINK: <span style="color:var(--neon-green)">STABLE</span>
        </div>
    </nav>

    <main>
        <div class="pack" onclick="launchModule(this, '/vantavigil/encoder')">
            <div class="card">
                <img src="assets/img/logo.png" class="card-img" alt="Logo">
                <h2 style="margin-top:20px; letter-spacing:5px; color:var(--text-gray); font-size:1.2rem;">ENCODER</h2>
            </div>
            <div class="foil"></div>
        </div>
        
        <div class="pack" style="opacity: 0.1; cursor: not-allowed;">
            <div class="card"><h2 style="color:#222;">LOCKED</h2></div>
            <div class="foil"></div>
        </div>
    </main>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top:20px; letter-spacing:5px; color:var(--text-gray); font-size:12px;">AUTHORIZING ACCESS...</p>
    </div>

    <script>
        // --- 1. PLEXUS ARKA PLAN SCRIPT ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4
                });
            }
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                
                ctx.fillStyle = 'rgba(0, 210, 255, 0.2)';
                ctx.beginPath(); ctx.arc(p.x, p.y, 1.2, 0, Math.PI*2); ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 150) {
                        ctx.strokeStyle = `rgba(0, 210, 255, ${1 - dist/150 - 0.8})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawCanvas);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        drawCanvas();

        // --- 2. GERI TUSU VE UI RESET SCRIPT ---
        window.onpageshow = function(event) {
            document.getElementById('loading-screen').style.display = 'none';
            document.querySelectorAll('.pack').forEach(p => p.classList.remove('ripped'));
        };

        // --- 3. MODUL ACILIS SCRIPT ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playRipSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function launchModule(element, url) {
            if (element.classList.contains('ripped')) return;
            
            playRipSound();
            element.classList.add('ripped');

            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'flex';
                setTimeout(() => {
                    window.location.href = url;
                }, 2000);
            }, 1000);
        }
    </script>
</body>
</html>
