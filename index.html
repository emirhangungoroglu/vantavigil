<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | MENU</title>
    
    <link rel="icon" href="assets/img/icon.png" type="image/png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --neon-blue: #00d2ff;
            --neon-green: #00ff41;
            --text-gray: #888888;
            --bg-dark: #020202;
            --nav-bg: rgba(10, 10, 10, 0.98);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-dark) url('assets/img/background.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: " ";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 4px 100%;
            z-index: 100; pointer-events: none;
        }

        /* --- NAVBAR --- */
        .navbar {
            width: 100%; height: 80px;
            background: var(--nav-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; padding: 0 40px;
            position: relative; z-index: 1001;
            backdrop-filter: blur(10px);
        }

        .nav-left { flex: 1; display: flex; align-items: center; }
        .main-logo { height: 60px; width: auto; filter: grayscale(0.5); transition: 0.3s; }

        .nav-center { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; }
        .brand-text {
            font-size: 1.8rem; letter-spacing: 12px; font-weight: 900;
            color: var(--text-gray); text-transform: uppercase;
        }

        /* Nav Sağ Taraf (Status + Music) */
        .nav-right {
            flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 20px;
            font-size: 11px; font-family: monospace; letter-spacing: 2px;
        }

        /* Müzik Toggle Butonu */
        #music-toggle {
            cursor: pointer; display: flex; align-items: center; transition: 0.3s;
            color: var(--neon-blue); filter: drop-shadow(0 0 5px var(--neon-blue));
        }
        #music-toggle:hover { transform: scale(1.1); filter: drop-shadow(0 0 10px var(--neon-blue)); }

        .status-dot {
            display: inline-block; width: 8px; height: 8px; 
            background: var(--neon-green); border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-green);
            margin-right: 5px; animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* --- MODÜL IZGARASI --- */
        main {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 25px;
            z-index: 10; padding: 0 20px;
        }

        .pack { width: 210px; height: 320px; position: relative; cursor: pointer; transition: 0.4s; }
        .pack:not(.locked):hover { transform: translateY(-15px); }
        .pack.ripped { filter: drop-shadow(0 0 20px var(--neon-blue)); }

        .card {
            position: absolute; inset: 0; background: rgba(8, 8, 8, 0.95);
            border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1; backdrop-filter: blur(15px);
        }

        .card-img { width: 100px; filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.2)); }
        .card-title { margin-top: 15px; letter-spacing: 3px; color: var(--text-gray); font-size: 0.85rem; font-weight: 700; }

        .pack.locked { opacity: 0.6; cursor: not-allowed; }
        .pack.locked .card { background: rgba(5, 5, 5, 0.98); border-style: dashed; }
        .lock-text { color: #1a1a1a; font-size: 0.65rem; letter-spacing: 2px; margin-top: 8px; }

        .foil {
            position: absolute; inset: -1px; z-index: 10;
            background: linear-gradient(135deg, #1a1a1a, #050505);
            border-radius: 15px; border: 1px solid #222;
            transition: 1.2s cubic-bezier(0.9, 0, 0.1, 1);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        .ripped .foil { clip-path: polygon(100% 100%, 100% 100%, 100% 100%, 100% 100%); opacity: 0; pointer-events: none; }

        footer { width: 100%; height: 40px; background: rgba(0,0,0,0.8); border-top: 1px solid #111; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #333; letter-spacing: 2px; }

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left"><img src="assets/img/logo.png" alt="Logo" class="main-logo"></div>
        <div class="nav-center"><h1 class="brand-text">VANTAVIGIL</h1></div>
        <div class="nav-right">
            <div id="music-toggle" onclick="toggleMusic()">
                <span id="music-icon">🔇</span> </div>
            <div><span class="status-dot"></span> STATUS: <span style="color:var(--neon-green)">ONLINE</span></div>
        </div>
    </nav>

    <audio id="bg-theme" loop pre-load="auto">
        <source src="assets/audio/theme.mp3" type="audio/mpeg">
    </audio>

    <main>
        <div class="pack" onclick="launchModule(this, '/vantavigil/encoder')">
            <div class="card">
                <img src="assets/img/logo.png" class="card-img" alt="Encoder">
                <h2 class="card-title">ENCODER</h2>
                <span style="font-size: 8px; color: #333; margin-top: 5px;">CLICK TO ACCESS</span>
            </div>
            <div class="foil"></div>
        </div>
        
        <div class="pack" onclick="launchModule(this, '/vantavigil/hash-gen')">
            <div class="card">
                <img src="assets/img/logo.png" class="card-img" alt="Hash Gen">
                <h2 class="card-title">HASH GEN</h2>
                <span style="font-size: 8px; color: #333; margin-top: 5px;">CLICK TO ACCESS</span>
            </div>
            <div class="foil"></div>
        </div>

        <div class="pack locked"><div class="card"><h2 class="card-title" style="color:#111">COMING SOON</h2></div><div class="foil"></div></div>
        <div class="pack locked"><div class="card"><h2 class="card-title" style="color:#111">COMING SOON</h2></div><div class="foil"></div></div>
        <div class="pack locked"><div class="card"><h2 class="card-title" style="color:#111">COMING SOON</h2></div><div class="foil"></div></div>
    </main>

    <footer>VANTAVIGIL SECURITY OPERATIONS CENTER // INTERNAL ACCESS ONLY</footer>

    <script>
        const music = document.getElementById('bg-theme');
        music.volume = 0.1;

        // Müzik Aç/Kapat Fonksiyonu
        function toggleMusic() {
            if (music.paused) {
                music.play();
                document.getElementById('music-icon').innerText = '🔊';
            } else {
                music.pause();
                document.getElementById('music-icon').innerText = '🔇';
            }
        }

        window.onpageshow = function(event) { 
            document.querySelectorAll('.pack').forEach(p => p.classList.remove('ripped')); 
        };

        function launchModule(element, url) {
            if (element.classList.contains('locked')) return;

            // İlk tıklamada müziği otomatik başlat (UI güncellenerek)
            if (music.paused) {
                music.play().then(() => {
                    document.getElementById('music-icon').innerText = '🔊';
                }).catch(e => console.log("Otomatik ses engellendi."));
            }

            if (!element.classList.contains('ripped')) {
                element.classList.add('ripped');
            } else {
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
