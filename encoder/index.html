<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | Encoder</title>
    <link rel="icon" type="image/png" href="../assets/img/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        /* === TÜM CSS BURADA === */
        :root {
            --vanta-black: #020202;
            --vanta-surface: #0a0a0c;
            --cyber-neon: #00ffcc;
            --cyber-blue: #00aaff;
            --border: #1a1a1e;
            --text: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--vanta-black); color: var(--text); font-family: 'JetBrains Mono', monospace; min-height: 100vh; display: flex; flex-direction: column; }

        .navbar { height: 110px; background: #000; border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 5%; position: fixed; width: 100%; top: 0; z-index: 1000; }
        .nav-brand { display: flex; align-items: center; gap: 20px; }
        .logo-box { background: #080808; padding: 10px; border: 1px solid #222; border-radius: 4px; }
        .nav-logo { height: 80px; width: auto; display: block; filter: drop-shadow(0 0 10px var(--cyber-neon)); }
        .brand-name { font-size: 1.8rem; letter-spacing: 6px; font-weight: 800; color: #fff; }
        
        .nav-links a { color: #444; text-decoration: none; margin-left: 40px; font-size: 0.8rem; letter-spacing: 2px; transition: 0.3s; }
        .nav-links a.active, .nav-links a:hover { color: var(--cyber-neon); text-shadow: 0 0 10px var(--cyber-neon); }

        .main-wrapper { padding-top: 150px; flex: 1; display: flex; justify-content: center; align-items: flex-start; }
        .cyber-container { width: 95%; max-width: 1400px; padding: 20px; }
        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .editor-module { background: var(--vanta-surface); border: 1px solid var(--border); position: relative; }
        .module-bar { background: #000; padding: 8px 15px; font-size: 0.7rem; color: #666; border-bottom: 1px solid var(--border); }
        
        textarea { width: 100%; height: 450px; background: #000; border: none; color: var(--cyber-neon); padding: 20px; font-family: inherit; font-size: 14px; resize: none; outline: none; }
        .detect-overlay { position: absolute; bottom: 10px; right: 10px; font-size: 0.65rem; color: var(--cyber-neon); background: rgba(0,0,0,0.8); padding: 5px 10px; border: 1px solid var(--cyber-neon); }

        .control-center { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; background: #050505; border: 1px solid var(--border); padding: 25px; }
        .select-box { display: flex; flex-direction: column; gap: 10px; flex: 1; max-width: 350px; }
        select { background: #000; color: #fff; border: 1px solid var(--cyber-neon); padding: 12px; font-family: inherit; outline: none; }
        
        .action-group { display: flex; gap: 20px; }
        .glow-btn { padding: 15px 45px; background: transparent; font-family: inherit; font-weight: bold; font-size: 0.9rem; letter-spacing: 2px; transition: 0.4s; border: 1px solid transparent; cursor: pointer; }
        .btn-green { border-color: var(--cyber-neon); color: var(--cyber-neon); }
        .btn-green:hover { background: var(--cyber-neon); color: #000; box-shadow: 0 0 30px var(--cyber-neon); }
        .btn-blue { border-color: var(--cyber-blue); color: var(--cyber-blue); }
        .btn-blue:hover { background: var(--cyber-blue); color: #000; box-shadow: 0 0 30px var(--cyber-blue); }
        
        .utility-btn { width: 100%; padding: 12px; background: #000; border: none; border-top: 1px solid var(--border); color: #444; font-family: inherit; cursor: pointer; }
        .utility-btn:hover { color: var(--cyber-neon); }

        .pulse { animation: pulse-anim 2s infinite; }
        @keyframes pulse-anim { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        footer { padding: 40px; text-align: center; color: #333; font-size: 0.7rem; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <div class="logo-box">
                <img src="../assets/img/logo.png" alt="Vantavigil Logo" class="nav-logo">
            </div>
            <span class="brand-name">VANTAVIGIL</span>
        </div>
        <div class="nav-links">
            <a href="../">HUB</a>
            <a href="./" class="active">ENCODER</a>
            <a href="https://emirhangungoroglu.github.io/about">ABOUT</a>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="cyber-container">
            <header class="terminal-header">
                <div class="status-indicator">
                    <span class="dot pulse"></span>
                    <span class="status-msg">CORE_ENGINE_STABLE // SECURITY_ACTIVE</span>
                </div>
                <h1 class="main-title">CYBER ENCODER SUITE</h1>
            </header>

            <div class="workspace-grid">
                <div class="editor-module">
                    <div class="module-bar">INPUT_DATA_STREAM</div>
                    <textarea id="userInput" spellcheck="false" placeholder="Waiting for raw input..."></textarea>
                    <div id="detectedFormat" class="detect-overlay">DETECTED: UNKNOWN</div>
                </div>

                <div class="editor-module">
                    <div class="module-bar">OUTPUT_RESULT</div>
                    <textarea id="outputData" readonly spellcheck="false" placeholder="Processed output..."></textarea>
                    <button id="copyBtn" class="utility-btn">COPY_TO_CLIPBOARD</button>
                </div>
            </div>

            <div class="control-center">
                <div class="select-box">
                    <label>SELECT_ALGORITHM</label>
                    <select id="operationType">
                        <option value="base64">BASE64_STANDARD</option>
                        <option value="hex">HEXADECIMAL_HEX</option>
                        <option value="binary">BINARY_0101</option>
                        <option value="url">URL_ENCODING</option>
                        <option value="rot13">ROT13_CIPHER</option>
                        <option value="html">HTML_ENTITY_ENC</option>
                        <option value="defang">URL_DEFANGING</option>
                        <option value="charcode">JS_CHARCODE</option>
                        <option value="sha256">SHA-256_HASH</option>
                    </select>
                </div>
                <div class="action-group">
                    <button id="encodeBtn" class="glow-btn btn-green">RUN_ENCODE</button>
                    <button id="decodeBtn" class="glow-btn btn-blue">RUN_DECODE</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="cyber-footer">
        <p>TERMINAL v1.2.0 // &copy; 2025 VANTAVIGIL CORP // DEVELOPED BY EMIRHAN GUNGOROGLU</p>
    </footer>

    <script>
        /* === TÜM JAVASCRIPT BURADA === */
        const VantaModules = {
            detectEncoding(text) {
                if (!text || text.trim() === "") return "EMPTY";
                const clean = text.trim();
                if (/^[01\s]+$/.test(clean) && clean.length > 4) return "BINARY";
                if (/^[0-9A-Fa-f\s:]+$/.test(clean) && clean.length >= 2) return "HEXADECIMAL";
                if (/%[0-9A-Fa-f]{2}/.test(clean)) return "URL_ENCODED";
                if (/^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{2}==)?$/.test(clean)) return "BASE64";
                return "PLAIN_TEXT";
            },
            base64: {
                encode: (str) => btoa(unescape(encodeURIComponent(str))),
                decode: (str) => decodeURIComponent(escape(atob(str)))
            },
            hex: {
                encode: (str) => str.split('').map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join(' '),
                decode: (hex) => {
                    hex = hex.replace(/[\s:]/g, '');
                    const res = hex.match(/.{1,2}/g);
                    return res ? res.map(byte => String.fromCharCode(parseInt(byte, 16))).join('') : "";
                }
            },
            binary: {
                encode: (str) => str.split('').map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join(' '),
                decode: (bin) => bin.split(/\s+/).map(b => String.fromCharCode(parseInt(b, 2))).join('')
            },
            url: {
                encode: (str) => encodeURIComponent(str),
                decode: (str) => decodeURIComponent(str)
            },
            rot13: {
                encode: (str) => str.replace(/[a-zA-Z]/g, (c) => String.fromCharCode((c <= "Z" ? 90 : 122) >= (c = c.charCodeAt(0) + 13) ? c : c - 26)),
                decode: (str) => VantaModules.rot13.encode(str)
            },
            html: {
                encode: (str) => str.replace(/./gm, (s) => `&#${s.charCodeAt(0)};`),
                decode: (str) => { const txt = document.createElement("textarea"); txt.innerHTML = str; return txt.value; }
            },
            defang: {
                encode: (str) => str.replace(/\./g, "[.]").replace(/http/gi, "hxxp"),
                decode: (str) => str.replace(/\[\.\]/g, ".").replace(/hxxp/gi, "http")
            },
            charcode: {
                encode: (str) => "String.fromCharCode(" + str.split('').map(c => c.charCodeAt(0)).join(',') + ")",
                decode: (str) => { const matches = str.match(/\d+/g); return matches ? matches.map(c => String.fromCharCode(c)).join('') : "INVALID"; }
            },
            sha256: {
                encode: async (str) => {
                    const msgBuffer = new TextEncoder().encode(str);
                    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
                },
                decode: () => "HASH_IS_ONE_WAY"
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const inputArea = document.getElementById('userInput');
            const outputArea = document.getElementById('outputData');
            const detectLabel = document.getElementById('detectedFormat');
            const operationType = document.getElementById('operationType');

            inputArea.addEventListener('input', () => {
                detectLabel.innerText = "DETECTED: " + VantaModules.detectEncoding(inputArea.value);
            });

            document.getElementById('encodeBtn').addEventListener('click', async () => {
                if(!inputArea.value) return;
                try { outputArea.value = await VantaModules[operationType.value].encode(inputArea.value); }
                catch (e) { outputArea.value = "ERR: ENC_FAILED"; }
            });

            document.getElementById('decodeBtn').addEventListener('click', () => {
                if(!inputArea.value) return;
                try { outputArea.value = VantaModules[operationType.value].decode(inputArea.value); }
                catch (e) { outputArea.value = "ERR: DEC_FAILED"; }
            });

            document.getElementById('copyBtn').addEventListener('click', () => {
                navigator.clipboard.writeText(outputArea.value).then(() => {
                    document.getElementById('copyBtn').innerText = "COPIED!";
                    setTimeout(() => { document.getElementById('copyBtn').innerText = "COPY_TO_CLIPBOARD"; }, 2000);
                });
            });
        });
    </script>
</body>
</html>
