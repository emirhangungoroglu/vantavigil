<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | NEXUS RECON</title>
    
    <link rel="icon" href="../assets/img/icon.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --neon-blue: #00f2ff;
            --neon-green: #00ff41;
            --neon-red: #ff3131;
            --bg-dark: #020202;
            --panel-bg: rgba(5, 5, 5, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html { 
            height: 100%; width: 100%; 
            background: var(--bg-dark); 
            color: white; 
            font-family: 'Orbitron', sans-serif;
            display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        /* --- ARKA PLAN (SABİT) --- */
        .map-container {
            position: fixed; inset: 0;
            background: url('../assets/img/world-map.png') no-repeat center center;
            background-size: 100% 100%; 
            opacity: 0.22; z-index: 1;
            filter: brightness(1.1) contrast(1.2);
            pointer-events: none;
        }

        body::after {
            content: ""; position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px; z-index: 2; 
            pointer-events: none;
        }

        /* --- NAVBAR --- */
        .navbar {
            width: 100%; height: 60px; /* Boyut küçültüldü */
            background: rgba(8, 8, 8, 0.98);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; padding: 0 30px;
            z-index: 2000; flex-shrink: 0;
            backdrop-filter: blur(15px);
        }
        .main-logo { height: 35px; cursor: pointer; filter: drop-shadow(0 0 10px var(--neon-blue)); }
        .nav-center { position: absolute; left: 50%; transform: translateX(-50%); letter-spacing: 8px; color: #1a1a1a; font-weight: 900; font-size: 0.8rem; }

        /* --- ANA İÇERİK (KÜÇÜLTÜLMÜŞ PANEL) --- */
        main { 
            flex: 1 0 auto; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 30px 20px; z-index: 10; position: relative;
        }

        /* Konteyner genişliği 1100px'den 650px'e düşürüldü (%50 küçülme) */
        .recon-container { width: 100%; max-width: 650px; }

        .search-bay {
            background: var(--panel-bg); border: 1px solid #1a1a1a; padding: 15px; /* Padding düşürüldü */
            border-radius: 10px; backdrop-filter: blur(30px); display: flex; gap: 12px;
            position: relative; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.9);
            margin-bottom: 20px;
        }

        input {
            flex: 1; background: #000; border: 1px solid #222; padding: 10px;
            color: var(--neon-blue); font-family: 'JetBrains Mono', monospace;
            font-size: 12px; border-radius: 4px; outline: none; letter-spacing: 1px;
        }

        .scan-btn {
            padding: 0 25px; background: none; border: 1px solid var(--neon-blue);
            color: var(--neon-blue); font-family: 'Orbitron'; cursor: pointer;
            letter-spacing: 2px; font-weight: 900; transition: 0.4s; font-size: 0.7rem;
        }
        .scan-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px var(--neon-blue); }

        /* SONUÇLAR IZGARASI */
        .intelligence-grid {
            display: grid; grid-template-columns: 1fr 1.5fr; gap: 15px; display: none;
            animation: slideUp 0.6s ease-out; margin-bottom: 30px;
        }

        .info-card { background: var(--panel-bg); border: 1px solid #1a1a1a; padding: 15px; border-radius: 8px; }
        .data-label { color: var(--neon-blue); font-size: 7px; letter-spacing: 1px; margin-bottom: 3px; font-weight: bold; }
        .data-value { color: #fff; font-family: 'JetBrains Mono'; font-size: 11px; margin-bottom: 12px; border-bottom: 1px solid #111; padding-bottom: 3px; }

        .pivot-matrix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .pivot-link {
            text-decoration: none; border: 1px solid #111; padding: 8px; text-align: center;
            color: #444; font-size: 8px; font-weight: 700; transition: 0.3s; background: rgba(0,0,0,0.5);
        }
        .pivot-link:hover { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 10px rgba(0, 255, 65, 0.1); }

        footer { 
            width: 100%; height: 40px; 
            background: rgba(0,0,0,0.95); 
            border-top: 1px solid #111; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 8px; color: #444; letter-spacing: 3px; 
            z-index: 2000; flex-shrink: 0; 
            margin-top: auto;
        }

        .side-panel { position: fixed; top: 80px; right: 25px; display: flex; flex-direction: column; gap: 10px; z-index: 2005; }
        .side-btn { 
            width: 40px; height: 40px; background: rgba(5, 5, 5, 0.9); border: 1px solid var(--neon-blue); 
            color: var(--neon-blue); display: flex; align-items: center; justify-content: center; 
            cursor: pointer; font-size: 15px; transition: 0.3s;
        }

        #target-pulse {
            position: fixed; width: 15px; height: 15px; background: var(--neon-red);
            border-radius: 50%; display: none; z-index: 5; transform: translate(-50%, -50%);
            box-shadow: 0 0 20px var(--neon-red); pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="map-container"></div>
    <div id="target-pulse"></div>

    <nav class="navbar">
        <img src="../assets/img/logo.png" class="main-logo" onclick="window.location.href='../'">
        <div class="nav-center">NEXUS_RECON // GLOBAL_INTEL_STATION</div>
    </nav>

    <div class="side-panel">
        <div class="side-btn">?</div>
        <div class="side-btn" id="music-btn" onclick="toggleMusic()">🔇</div>
    </div>

    <audio id="bg-music" loop><source src="../assets/audio/theme.mp3" type="audio/mpeg"></audio>
    <audio id="sfx-scan"><source src="../assets/audio/scan.mp3" type="audio/mpeg"></audio>
    <audio id="sfx-success"><source src="../assets/audio/success.mp3" type="audio/mpeg"></audio>

    <main>
        <div class="recon-container">
            <h1 style="font-size: 9px; letter-spacing: 4px; color: var(--neon-blue); margin-bottom: 10px; text-align: center;">> ENTER_TARGET_COORDINATES</h1>
            
            <div class="search-bay">
                <input type="text" id="targetInput" placeholder="IP ADDRESS OR DOMAIN (e.g. 8.8.8.8)" spellcheck="false">
                <button class="scan-btn" onclick="startRecon()">EXECUTE SCAN</button>
            </div>

            <div id="resultsArea" class="intelligence-grid">
                <div class="info-card">
                    <h1 style="font-size: 8px; color: var(--neon-green); margin-bottom: 15px; letter-spacing: 1px;">LOCAL_INTEL_REPORT</h1>
                    <div class="data-label">GEOGRAPHIC_LOCATION</div>
                    <div class="data-value" id="res-country">-</div>
                    <div class="data-label">CITY_COORDINATES</div>
                    <div class="data-value" id="res-city">-</div>
                    <div class="data-label">NETWORK_PROVIDER</div>
                    <div class="data-value" id="res-isp">-</div>
                </div>
                <div class="info-card">
                    <h1 style="font-size: 8px; color: var(--neon-blue); margin-bottom: 15px; letter-spacing: 1px;">GLOBAL_RECON_MATRIX</h1>
                    <div class="pivot-matrix" id="pivotContainer"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>VANTAVIGIL SECURITY OPERATIONS CENTER // INTERNAL USE ONLY</footer>

    <script>
        const music = document.getElementById('bg-music');
        const sfxScan = document.getElementById('sfx-scan');
        const sfxSuccess = document.getElementById('sfx-success');
        const pulse = document.getElementById('target-pulse');
        music.volume = 0.1;

        function toggleMusic() {
            if (music.paused) { music.play(); document.getElementById('music-btn').innerText = '🔊'; }
            else { music.pause(); document.getElementById('music-btn').innerText = '🔇'; }
        }

        async function startRecon() {
            const input = document.getElementById('targetInput').value.trim();
            if (!input) return;

            sfxScan.play();
            if (music.paused) toggleMusic();
            document.getElementById('resultsArea').style.display = 'grid';
            
            try {
                const response = await fetch(`https://ipapi.co/${input}/json/`);
                const data = await response.json();

                if (!data.error) {
                    sfxSuccess.play();
                    document.getElementById('res-country').innerText = `${data.country_name} (${data.country_code})`;
                    document.getElementById('res-city').innerText = `${data.city} [LAT: ${data.latitude}, LON: ${data.longitude}]`;
                    document.getElementById('res-isp').innerText = data.org || data.asn || "UNKNOWN";

                    const lat = parseFloat(data.latitude);
                    const lon = parseFloat(data.longitude);
                    const mapWidthFactor = 84; 
                    const mapHeightFactor = 70; 
                    const posX = 8 + (lon + 180) * (mapWidthFactor / 360);
                    const posY = 15 + (90 - lat) * (mapHeightFactor / 180);
                    
                    pulse.style.display = 'block';
                    pulse.style.left = posX + '%';
                    pulse.style.top = posY + '%';
                }
            } catch (e) { console.log(e); }

            const pivots = [
                { name: "SHODAN", url: `https://www.shodan.io/host/${input}` },
                { name: "ABUSE_IP", url: `https://www.abuseipdb.com/check/${input}` },
                { name: "VIRUSTOTAL", url: `https://www.virustotal.com/gui/search/${input}` },
                { name: "TALOS", url: `https://www.talosintelligence.com/reputation_center/lookup?search=${input}` },
                { name: "WHOIS", url: `https://who.is/whois/${input}` },
                { name: "OTX", url: `https://otx.alienvault.com/indicator/ip/${input}` }
            ];

            let html = "";
            pivots.forEach(p => html += `<a href="${p.url}" target="_blank" class="pivot-link">${p.name}</a>`);
            document.getElementById('pivotContainer').innerHTML = html;
        }
    </script>
</body>
</html>
