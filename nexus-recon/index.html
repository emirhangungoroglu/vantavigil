<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTAVIGIL | NEXUS RECON</title>
    
    <link rel="icon" href="../../assets/img/icon.png" type="image/png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --neon-blue: #00f2ff;
            --neon-green: #00ff41;
            --bg-dark: #020202;
            --panel-bg: rgba(5, 5, 5, 0.92);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- ARKA PLAN: PNG HARİTA --- */
        .background-map {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('../../assets/img/world-map.png') no-repeat center center;
            background-size: cover; /* PNG'nin tüm ekranı kaplaması için */
            opacity: 0.12;
            z-index: 1;
            filter: brightness(1.2) contrast(1.1);
            animation: mapPulse 12s infinite alternate ease-in-out;
        }

        @keyframes mapPulse {
            0% { transform: scale(1); opacity: 0.08; }
            100% { transform: scale(1.08); opacity: 0.15; }
        }

        /* Siber Scanline Efekti */
        body::after {
            content: ""; position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px; z-index: 100; pointer-events: none;
        }

        /* --- NAVBAR --- */
        .navbar {
            width: 100%; height: 80px; background: rgba(8, 8, 8, 0.98);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; padding: 0 40px;
            z-index: 1001; backdrop-filter: blur(15px);
        }
        .main-logo { height: 55px; cursor: pointer; filter: grayscale(0.8); transition: 0.4s; }
        .main-logo:hover { filter: grayscale(0) drop-shadow(0 0 10px var(--neon-blue)); }
        .nav-center { position: absolute; left: 50%; transform: translateX(-50%); letter-spacing: 12px; color: #222; font-weight: 900; }

        /* --- ANA PANEL --- */
        main {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; padding: 20px;
        }

        .recon-container {
            width: 100%; max-width: 1100px;
            display: flex; flex-direction: column; gap: 25px;
        }

        /* RADAR SCANNER SEARCH BOX */
        .search-bay {
            background: var(--panel-bg); border: 1px solid #111;
            padding: 35px; border-radius: 15px; backdrop-filter: blur(25px);
            display: flex; gap: 20px; position: relative; overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        .search-bay::before {
            content: ""; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.08), transparent);
            animation: radarSweep 5s infinite linear;
        }

        @keyframes radarSweep { 0% { left: -100%; } 100% { left: 100%; } }

        input {
            flex: 1; background: #000; border: 1px solid #1a1a1a;
            padding: 20px; color: var(--neon-blue); font-family: 'JetBrains Mono', monospace;
            font-size: 15px; border-radius: 5px; outline: none; letter-spacing: 2px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .scan-btn {
            padding: 0 45px; background: none; border: 1px solid var(--neon-blue);
            color: var(--neon-blue); font-family: 'Orbitron'; cursor: pointer;
            letter-spacing: 4px; font-weight: 900; transition: 0.4s;
        }
        .scan-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 40px var(--neon-blue); }

        /* --- SONUÇ IZGARASI --- */
        .intelligence-grid {
            display: grid; grid-template-columns: 1fr 2fr; gap: 20px; display: none;
            animation: panelFade 0.8s ease-out;
        }

        @keyframes panelFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .info-card {
            background: var(--panel-bg); border: 1px solid #111;
            padding: 30px; border-radius: 12px; backdrop-filter: blur(20px);
        }

        .data-label { color: var(--neon-blue); font-size: 8px; letter-spacing: 2px; margin-bottom: 8px; font-weight: 700; }
        .data-value { color: #eee; font-family: 'JetBrains Mono'; font-size: 14px; margin-bottom: 20px; border-bottom: 1px solid #111; padding-bottom: 5px; }

        .pivot-matrix {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }
        .pivot-link {
            text-decoration: none; border: 1px solid #111; padding: 18px;
            text-align: center; color: #555; font-size: 10px; font-weight: 700; transition: 0.3s;
            background: rgba(0,0,0,0.3);
        }
        .pivot-link:hover { border-color: var(--neon-green); color: var(--neon-green); background: rgba(0, 255, 65, 0.05); box-shadow: 0 0 15px rgba(0, 255, 65, 0.1); }

        /* --- YAN PANEL --- */
        .side-panel { position: fixed; top: 110px; right: 40px; display: flex; flex-direction: column; gap: 15px; z-index: 1005; }
        .side-btn { 
            width: 50px; height: 50px; background: rgba(5, 5, 5, 0.9); border: 1px solid var(--neon-blue); 
            color: var(--neon-blue); display: flex; align-items: center; justify-content: center; 
            cursor: pointer; font-size: 20px; transition: 0.3s;
        }
        .side-btn:hover { box-shadow: 0 0 25px var(--neon-blue); transform: scale(1.1); background: var(--neon-blue); color: #000; }

        footer { width: 100%; height: 45px; background: rgba(0,0,0,0.95); border-top: 1px solid #111; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #444; letter-spacing: 4px; }
    </style>
</head>
<body>

    <div class="background-map"></div>

    <nav class="navbar">
        <img src="../../assets/img/logo.png" class="main-logo" onclick="window.location.href='../'">
        <div class="nav-center">NEXUS_RECON // GLOBAL_INTEL_STATION</div>
    </nav>

    <div class="side-panel">
        <div class="side-btn" onclick="alert('NEXUS RECON v1.0\n\n- Zero-Log Privacy Policy\n- Real-time GeoIP Fetching\n- External Intelligence Pivot Matrix\n- Professional OSINT Environment')">?</div>
        <div class="side-btn" id="music-btn" onclick="toggleMusic()">🔇</div>
    </div>

    <audio id="bg-music" loop>
        <source src="../../assets/audio/theme.mp3" type="audio/mpeg">
    </audio>

    <main>
        <div class="recon-container">
            <h1 style="font-size: 11px; letter-spacing: 6px; color: var(--neon-blue); margin-bottom: 12px;">> ENTER_TARGET_COORDINATES</h1>
            
            <div class="search-bay">
                <input type="text" id="targetInput" placeholder="IP ADDRESS OR DOMAIN (e.g. 8.8.8.8)" spellcheck="false">
                <button class="scan-btn" onclick="startRecon()">EXECUTE SCAN</button>
            </div>

            <div id="resultsArea" class="intelligence-grid">
                <div class="info-card">
                    <h1 style="font-size: 9px; color: var(--neon-green); margin-bottom: 25px; letter-spacing: 2px;">LOCAL_INTEL_REPORT</h1>
                    <div class="data-label">GEOGRAPHIC_LOCATION</div>
                    <div class="data-value" id="res-country">WAITING...</div>
                    <div class="data-label">CITY_COORDINATES</div>
                    <div class="data-value" id="res-city">WAITING...</div>
                    <div class="data-label">NETWORK_PROVIDER</div>
                    <div class="data-value" id="res-isp">WAITING...</div>
                </div>

                <div class="info-card">
                    <h1 style="font-size: 9px; color: var(--neon-blue); margin-bottom: 25px; letter-spacing: 2px;">GLOBAL_RECON_MATRIX</h1>
                    <div class="pivot-matrix" id="pivotContainer">
                        </div>
                </div>
            </div>
        </div>
    </main>

    <footer>VANTAVIGIL SECURITY OPERATIONS CENTER // INTERNAL USE ONLY</footer>

    <script>
        const music = document.getElementById('bg-music');
        music.volume = 0.08;

        function toggleMusic() {
            if (music.paused) { music.play(); document.getElementById('music-btn').innerText = '🔊'; }
            else { music.pause(); document.getElementById('music-btn').innerText = '🔇'; }
        }

        async function startRecon() {
            const input = document.getElementById('targetInput').value.trim();
            if (!input) return;

            // Paneli Görünür Yap
            const resultsArea = document.getElementById('resultsArea');
            resultsArea.style.display = 'grid';
            
            // Veri Çekme İşlemi (ipapi.co)
            try {
                const response = await fetch(`https://ipapi.co/${input}/json/`);
                const data = await response.json();

                if (data.error) {
                    document.getElementById('res-country').innerText = "NO_DATA_FOUND";
                    document.getElementById('res-city').innerText = "N/A";
                    document.getElementById('res-isp').innerText = "N/A";
                } else {
                    document.getElementById('res-country').innerText = `${data.country_name} (${data.country_code})`;
                    document.getElementById('res-city').innerText = `${data.city} [LAT: ${data.latitude}, LON: ${data.longitude}]`;
                    document.getElementById('res-isp').innerText = data.org || data.asn || "UNKNOWN_PROVIDER";
                }
            } catch (e) {
                console.log("Recon Error:", e);
                document.getElementById('res-country').innerText = "CONNECTION_ERROR";
            }

            // Pivot Matrix Linkleri (Profesyonel Araçlar)
            const pivots = [
                { name: "SHODAN_HOST", url: `https://www.shodan.io/host/${input}` },
                { name: "ABUSE_IP_CHECK", url: `https://www.abuseipdb.com/check/${input}` },
                { name: "VIRUSTOTAL_INTEL", url: `https://www.virustotal.com/gui/search/${input}` },
                { name: "TALOS_REPUTATION", url: `https://www.talosintelligence.com/reputation_center/lookup?search=${input}` },
                { name: "WHOIS_LOOKUP", url: `https://who.is/whois/${input}` },
                { name: "ALIENVAULT_OTX", url: `https://otx.alienvault.com/indicator/ip/${input}` }
            ];

            let html = "";
            pivots.forEach(p => {
                html += `<a href="${p.url}" target="_blank" class="pivot-link">${p.name}</a>`;
            });
            document.getElementById('pivotContainer').innerHTML = html;
        }
    </script>
</body>
</html>
